name: Rename video to meadia
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename video and remove this workflow
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git mv assets/aftertone-demo.mp4 assets/meadia.mp4
          rm .github/workflows/rename-meadia.yml
          git add -A
          git commit -m "Rename AFTERTONE demo video to meadia.mp4"
          git push
